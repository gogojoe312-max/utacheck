name: Verify first-tab imports
on:
  push:
    branches: [work/first-tab-1127]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5eb10682e8a844d93eb4a4fd77357c1dab5afb8
      - run: node --test --test-reporter=tap tests/*.test.cjs >/tmp/results || { grep -A20 '^not ok' /tmp/results; exit 1; }
