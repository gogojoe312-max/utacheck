name: Verify and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/utacheck-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/utacheck-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify behavior, received member data, save and reload
        env:
          NODE_PATH: ${{ runner.temp }}/utacheck-browser/node_modules
        run: node scripts/release-gate.cjs pre
      - name: Preserve check results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-evidence
          path: release-evidence/
      - name: Prepare tested site
        if: github.ref == 'refs/heads/main'
        run: node scripts/prepare-pages.cjs
      - name: Upload tested site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the tested revision
        id: deployment
        uses: actions/deploy-pages@v4
  final-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preflight-evidence
          path: release-evidence
      - name: Install isolated test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/utacheck-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/utacheck-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check exact public assets and public member screens
        env:
          NODE_PATH: ${{ runner.temp }}/utacheck-browser/node_modules
        run: node scripts/release-gate.cjs post
      - name: Keep final result, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-evidence
          path: release-evidence/
