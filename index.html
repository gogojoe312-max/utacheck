<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>歌チェック</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="歌チェック">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#07080A; --panel:#13151A; --panel2:#1B1E25; --line:#242830;
  --text:#EAE6DE; --dim:#79808B; --accent:#F0B23C; --good:#5BC98A; --bad:#FF5C42;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;-webkit-user-select:none;user-select:none;
}
/* 画面いっぱいに広げる。height:100% は親に頼るので端末によって短くなる。
   安全余白（ノッチ・ホームバー）は、上下のバーの中で取る。 */
/* 画面いっぱい。inset で四辺を留めるのが、この端末の「見えている範囲」そのもの。 */
#app{position:fixed;top:0;right:0;bottom:0;left:0;
  display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row>.grow{min-width:0}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 長い曲名で後半が切れないよう、2行まで折り返して出す */
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.35}
.hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left))}
.hd .grow,.hd .t1,.hd .t2{min-width:0}
.hd .ic{flex:0 0 auto}
.hd .t1{font-size:11px;color:var(--dim)}
.hd .t2{font-size:16px;font-weight:600}
.ic{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.lnadd .txt, /* コピーで済ませる行は、録らないので薄く出す */
.lnskip{opacity:.35}
.lnskip .txt,.lnskip .ovt{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.55)}
.lnadd{color:#7FB3FF}
.lnage{background:rgba(240,178,60,.10);border-left:3px solid #F0B23C;border-radius:0 6px 6px 0}
.lnage .txt{color:#F0B23C}
.lnage .lbl{color:#F0B23C}
.ovage{color:#F0B23C!important;font-weight:700}
.newmk{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;margin-right:5px;border-radius:5px;
  background:var(--accent);color:#0A0A0A;font-weight:700;vertical-align:middle}
.ptcv{width:100%;height:260px;display:block;background:var(--panel2);border-radius:10px;touch-action:none}
.tkmk{display:inline-block;font-size:10px;line-height:1;padding:3px 6px;margin-right:6px;border-radius:5px;
  background:var(--accent);color:#0A0A0A;font-weight:700;vertical-align:middle}
.hamomk{color:#7FB3FF;font-weight:600;font-size:.86em}
.prn .hamomk{color:#2A5DA8}
.tagmk{display:inline-block;font-size:9px;line-height:1;padding:2px 4px;margin-right:4px;border-radius:4px;background:var(--panel2);color:var(--accent);font-weight:700;vertical-align:middle;border:1px solid var(--accent)}
.tknow{min-width:76px;height:38px;border-radius:11px;background:var(--accent);color:#0A0A0A;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;line-height:1}
.tknow i{display:inline-flex;align-items:center;font-style:normal;font-size:10px;font-weight:700;line-height:1;opacity:.7}
.tknow b{display:inline-flex;align-items:center;font-size:19px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tkbtn{width:34px;height:38px;border-radius:11px;background:var(--panel2);color:var(--text);font-size:20px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.solomk{display:inline-block;font-size:9px;line-height:1;padding:2px 4px;margin-right:4px;border-radius:4px;background:var(--accent);color:#0A0A0A;font-weight:700;vertical-align:middle}
/* 録りの想定。色は行ごとに変わるので、背景は書き込み側で入れる */
.vtmk{display:inline-block;font-size:9px;line-height:1;padding:2px 4px;margin-right:4px;border-radius:4px;color:#0A0A0A;font-weight:700;vertical-align:middle}
/* 想定のまとまりの頭に出す線。色は想定ごとに書き込み側で入れる */
.vtdiv{display:flex;align-items:center;gap:7px;margin:13px 0 3px;padding:0 10px;font-size:10px;font-weight:700}
.vtdiv:before{content:"";flex:0 0 16px;height:2px;background:currentColor;border-radius:1px}
.vtdiv:after{content:"";flex:1;height:2px;background:currentColor;opacity:.28;border-radius:1px}
.vtdivov{margin:10px 0 2px;padding:0}
.prv td{padding-top:6px}
.prv .prx{border-top:1.5px solid #333;font-size:.82em;color:#222;padding-top:2px}
.ovw{border-radius:0 4px 4px 0}
.prn .vtx{font-weight:700}
.ovword{display:flex;flex-direction:column}
.ovpage{display:flex;gap:16px;align-items:flex-start}
.ovcol{flex:1;min-width:0;display:flex;flex-direction:column}
.ovword.ovw2{display:block;column-fill:auto}
.ovword.ovw2 .ovw{break-inside:avoid;page-break-inside:avoid;display:flex}
.ovword.ovw2 .secdiv{break-inside:avoid}
.ovw{display:flex;gap:10px;text-align:left;padding:2px 2px;align-items:baseline}
.ovwn{flex:0 0 40px;text-align:right;color:var(--dim);font-size:.8em;font-variant-numeric:tabular-nums}
.ovw.lnadd{color:#7FB3FF}
.secdiv{display:flex;align-items:center;gap:8px;margin:14px 0 4px;color:var(--accent);font-size:11px;font-weight:700}
.secdiv:before{content:"";flex:0 0 10px;height:1px;background:var(--accent);opacity:.5}
.secdiv:after{content:"";flex:1;height:1px;background:var(--line)}
.sectabs{flex:0 0 auto;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;
  border-top:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}
.sectab{flex:0 0 auto;padding:11px 20px;border-radius:999px;background:var(--panel2);font-size:16px;font-weight:700;color:var(--dim)}
.sectab.on{background:var(--accent);color:#0A0A0A;font-weight:700}
.sectab.dn{color:var(--good);opacity:.75}
.sectab i{font-style:normal;font-size:10px;opacity:.7;margin-left:5px}
.rline{display:flex;width:100%;text-align:left;gap:10px;padding:5px 4px;align-items:baseline;border-radius:6px}
.rline:active{background:var(--panel2)}
.rnum{flex:0 0 46px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rtx{flex:1;font-size:16px;line-height:1.55;word-break:break-word}
.ogrid{width:100%;border-collapse:collapse;table-layout:fixed}
.ogrid td{vertical-align:baseline;padding:1px 3px;line-height:1.6;word-break:break-word}
.ogrid td.ogn{width:14%;text-align:right;color:var(--dim);font-size:.85em}
.ogrid td.ogx{width:36%}
.ogrid td.ogx button{width:100%;text-align:left;font-size:inherit;color:inherit}
.ogrid tr.ogz td{height:.5em;line-height:.5em;padding:0}
.ovcols{font-size:9px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.aubar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;overflow:hidden;
  border-top:1px solid var(--line);background:var(--panel)}
.aub{width:38px;height:38px;border-radius:12px;background:var(--panel2);flex:0 0 auto;font-size:15px;display:flex;align-items:center;justify-content:center}
.aubar input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line)}
.aubar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.bottom{flex:0 0 auto;display:flex;gap:6px;border-top:1px solid var(--line);background:var(--panel);overflow:hidden;
  padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
/* ボタンは中身ぶんだけ。余りは間の空きが吸うので、広がりすぎず はみ出しもしない */
.bottom button{flex:0 1 auto;min-width:0;background:var(--panel2);border-radius:11px;padding:9px 16px;
  display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:14px}
.bottom .wide{flex:0 1 auto;font-weight:500}
.bottom .grow{flex:1 1 0;min-width:0}
.bottom button.on{background:var(--accent);color:#0A0A0A}
.bottom .on{background:var(--accent);color:#0A0A0A}
.bottom .off{opacity:.3}

/* lyric rows */
.ln{display:flex;align-items:stretch;gap:8px;padding:7px 10px}
.lbl{flex:0 0 80px;text-align:right;font-size:11px;color:var(--dim);padding-top:5px;line-height:1.25;word-break:break-word}
.txt{flex:1;min-width:0;padding-left:4px;touch-action:pan-y;line-height:1.55}
.txt span{border-bottom:2px solid transparent;padding-bottom:1px;border-radius:2px}
.mk{display:inline-block;border:none;font-family:inherit;font-size:.5em;font-weight:700;color:#0A0A0A;border-radius:3px;
    padding:1px 3px;margin:0 1px 0 2px;vertical-align:middle;letter-spacing:0;white-space:nowrap;line-height:1.35}
.gap{height:16px}
.lngap{min-height:18px;opacity:.75}
.blk{flex:0 0 auto;display:flex;gap:14px;padding:6px 12px;border-bottom:1px solid var(--line);
  background:var(--panel);overflow-x:auto;white-space:nowrap;font-size:11px;-webkit-overflow-scrolling:touch}
.blkc{color:var(--dim);flex:0 0 auto;font-size:11px}
.prb{font-size:.9em;color:#444;margin:0 0 6px 2px}
.ink{position:absolute;left:0;top:0;z-index:5}


.pull{padding:26px 24px 130px;text-align:center;touch-action:none;-webkit-user-select:none}
.pullbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:10px}
.pullbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
.pulltx{font-size:12px;color:var(--dim)}
/* 何行にまたがる歌割かを示す括弧 */
.brk{flex:0 0 10px;position:relative;align-self:stretch}
.brk.first::before,.brk.mid::before,.brk.last::before{
  content:"";position:absolute;left:0;width:2px;background:var(--dim);opacity:.55}
.brk.first::before{top:8px;bottom:-8px}
.brk.mid::before{top:-8px;bottom:-8px}
.brk.last::before{top:-8px;bottom:9px}
.brk.first::after,.brk.last::after{content:"";position:absolute;left:0;width:8px;height:2px;background:var(--dim);opacity:.55}
.brk.first::after{top:8px}
.brk.last::after{bottom:9px}

/* 全体表示 */
.lnadd .txt, .lnadd{color:#7FB3FF}
.lnage{background:rgba(240,178,60,.10);border-left:3px solid #F0B23C;border-radius:0 6px 6px 0}
.lnage .txt{color:#F0B23C}
.lnage .lbl{color:#F0B23C}
.ovage{color:#F0B23C!important;font-weight:700}
.ovword.ovw2{display:block;column-fill:auto}
.ovword.ovw2 .ovw{break-inside:avoid;page-break-inside:avoid;display:flex}
.ovword.ovw2 .secdiv{break-inside:avoid}
.ovw.lnadd{color:#7FB3FF}
.secdiv:before{content:"";flex:0 0 10px;height:1px;background:var(--accent);opacity:.5}
.secdiv:after{content:"";flex:1;height:1px;background:var(--line)}
.sectabs{flex:0 0 auto;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;
  border-top:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}
.sectab.on{background:var(--accent);color:#0A0A0A;font-weight:700}
.sectab.dn{color:var(--good);opacity:.75}
.sectab i{font-style:normal;font-size:10px;opacity:.7;margin-left:5px}
.rline{display:flex;width:100%;text-align:left;gap:10px;padding:5px 4px;align-items:baseline;border-radius:6px}
.rline:active{background:var(--panel2)}
.rnum{flex:0 0 46px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rtx{flex:1;font-size:16px;line-height:1.55;word-break:break-word}
.ogrid{width:100%;border-collapse:collapse;table-layout:fixed}
.ogrid td{vertical-align:baseline;padding:1px 3px;line-height:1.6;word-break:break-word}
.ogrid td.ogn{width:14%;text-align:right;color:var(--dim);font-size:.85em}
.ogrid td.ogx{width:36%}
.ogrid td.ogx button{width:100%;text-align:left;font-size:inherit;color:inherit}
.ogrid tr.ogz td{height:.5em;line-height:.5em;padding:0}
.ovcols{column-count:2;column-gap:12px}
.ovl{display:flex;width:100%;text-align:left;gap:4px;padding:1px 0;break-inside:avoid;align-items:stretch}
.ovn{flex:0 0 52px;text-align:right;color:var(--dim);font-size:.8em;padding-top:1px;line-height:1.3;word-break:break-word}
.ovb{flex:0 0 7px;position:relative}
.ovb.first::before,.ovb.mid::before,.ovb.last::before{content:"";position:absolute;left:0;width:1px;background:var(--dim);opacity:.6}
.ovb.first::before{top:4px;bottom:-2px}
.ovb.mid::before{top:-2px;bottom:-2px}
.ovb.last::before{top:-2px;bottom:5px}
.ovb.first::after,.ovb.last::after{content:"";position:absolute;left:0;width:5px;height:1px;background:var(--dim);opacity:.6}
.ovb.first::after{top:4px}
.ovb.last::after{bottom:5px}
.ovt{flex:1;min-width:0;line-height:1.4}
.ovt span{border-bottom:1px solid transparent;border-radius:2px}
.ovm{font-size:.72em;padding:0 3px;margin:0 1px;border-radius:3px}
.pastmk{background:transparent!important;color:var(--dim)!important;border:1px dashed var(--dim);font-weight:400}

/* 簡易ピアノ */
.pno{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;background:#0B0C0F;padding:6px}
.pnoin{position:relative;height:92px;display:flex}
.wk{width:34px;height:92px;flex:0 0 34px;background:#E9E5DC;border:1px solid #00000055;border-radius:0 0 5px 5px;
    color:#4A4A4A;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.wk.on{background:#F0B23C;color:#0A0A0A;font-weight:700}
.bk{position:absolute;top:0;width:22px;height:56px;background:#111318;border:1px solid #000;border-radius:0 0 4px 4px;z-index:2}
.bk.on{background:#F0B23C}
.tagpill{display:inline-block;font-size:11px;background:var(--panel2);border-radius:6px;padding:2px 7px;margin:4px 4px 0 0;line-height:1.5;text-align:left}

/* sheet */
.mask{position:fixed;inset:0;background:#000A;display:flex;flex-direction:column;justify-content:flex-end;z-index:50}
.mask .sp{flex:1}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));max-height:90%;overflow-y:auto}
.sec{margin-bottom:16px}
.sec>h4{font-size:11px;color:var(--dim);font-weight:400;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{flex:0 0 auto;white-space:nowrap}
.chip{border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500;background:var(--panel2);border:1px solid var(--line)}
.chip.sm{padding:5px 12px;font-size:12px}

/* タップ＋上下左右のなぞりで選ぶタイル */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;height:88px;border-radius:14px;background:var(--panel2);
      display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:1fr auto 1fr;
      align-items:center;justify-items:center;touch-action:none;overflow:hidden}
.tmid{grid-column:2;grid-row:2;font-size:13px;font-weight:700;letter-spacing:-.06em;white-space:nowrap;padding:0 1px}
.tup,.tdn,.tlf,.trt{font-size:8.5px;color:var(--dim);white-space:nowrap;line-height:1;letter-spacing:-.06em;
  max-width:100%;overflow:hidden;text-overflow:clip}
.tlf,.trt{font-size:8px;max-width:38px;white-space:normal;text-align:center;line-height:1.05;word-break:keep-all}
.tlf.tmid4,.trt.tmid4{font-size:7.2px;max-width:40px;letter-spacing:-.09em}
.tlf.tlong,.trt.tlong{font-size:6.6px;max-width:42px;letter-spacing:-.1em;line-height:1}
.tup.tmid4,.tdn.tmid4{font-size:8px;letter-spacing:-.08em}
.tup.tlong,.tdn.tlong{font-size:7.4px;letter-spacing:-.1em}
.tup{grid-column:2;grid-row:1;align-self:center}
.tdn{grid-column:2;grid-row:3;align-self:center}
.tlf{grid-column:1;grid-row:2;justify-self:center}
.trt{grid-column:3;grid-row:2;justify-self:center}
.field{width:100%;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.primary{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#0A0A0A;font-weight:600;font-size:15px}
.ghost{width:100%;padding:13px;border-radius:14px;background:var(--panel2);font-size:14px;font-weight:500}
.rgtx{display:inline;touch-action:none;-webkit-user-select:none;user-select:none}
.rgline{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.rgn{flex:0 0 18px;font-size:9px;color:var(--dim);text-align:right}
.range{touch-action:none;-webkit-user-select:none;user-select:none;font-size:18px;line-height:1.9}
.range span{padding:3px 0;border-bottom:2px solid transparent}

/* setup / summary */
.card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:10px}
.pad{padding:0 14px}
.tabs{display:flex;gap:8px;padding:12px 14px;flex:0 0 auto;align-items:center}
.banner{flex:0 0 auto;padding:9px 14px;font-size:12px;background:var(--bad);color:#0A0A0A;display:flex;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--dim);line-height:1.7}
.grip{flex:0 0 20px;color:var(--dim);font-size:13px;text-align:center;touch-action:none;cursor:grab;-webkit-user-select:none}
.head{font-size:11px;color:var(--dim);font-weight:400;margin:18px 0 8px;letter-spacing:.08em}

/* 紙・PDF用 */
.pr.land .prbox{width:257mm;height:144mm}

.pr{background:#fff;color:#111;padding:0;width:170mm;margin:0 auto}



.prs{break-inside:avoid;page-break-inside:avoid}
.prs + .prs{break-before:page;page-break-before:always}
.prbox{width:170mm;height:196mm;overflow:hidden;position:relative}
.prin{transform-origin:top left}
.prs h3{font-size:1.35em;border-left:4px solid #111;padding-left:7px;margin-bottom:8px}
.prc{font-size:.62em;color:#666;font-weight:400}
.prl{display:flex;gap:6px;line-height:1.85;align-items:baseline;break-inside:avoid}
.prn{flex:0 0 30%;max-width:110px;text-align:right;color:#555;font-size:.85em;word-break:keep-all;overflow-wrap:normal}
.prx{flex:1;min-width:0}
.prx u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.prt{font-size:.85em;font-weight:700;margin-left:3px;white-space:nowrap}
.prp{font-size:.8em;color:#666;margin-left:3px}
.prg{width:100%;border-collapse:collapse;table-layout:fixed}
.prg td{vertical-align:baseline;padding:1px 3px;line-height:1.7}
.prg tr.prz td{height:.55em;line-height:.55em;padding:0}
.prg td.prn{width:15%;text-align:right;color:#555;font-size:.85em;word-break:keep-all;overflow-wrap:normal;max-width:none}
.prg td.prx{width:35%;word-break:break-word}
.prm{margin-top:10px;padding:7px 9px;border:1px solid #999;border-radius:4px;font-size:1em;white-space:pre-wrap;break-inside:avoid}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .pr.land .prbox{width:257mm;height:144mm}

.pr{transform:none!important;width:170mm!important;margin:0 auto!important;padding:2mm 0 0!important}
  #app{position:static;height:auto;display:block;overflow:visible}
  .noprint,.bottom,.hd{display:none!important}
  .scroll{overflow:visible!important;flex:none;padding:0!important;margin:0!important}
  .pr *{orphans:1;widows:1}
